<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardioPluz — รายงานผลสุขภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --teal:#1A9B8C;--teal-dk:#147A6E;--teal-lt:#E6F6F4;--teal-md:#A8DDD8;
  --cream:#F7F4EE;--cream2:#EDE9E0;--border:#D4CFC4;--bl:#EAE6DE;
  --text:#2C2820;--text2:#6B6057;--text3:#A89E94;
  --ok:#1A7A4A;--ok-bg:#EDF7F2;--ok-md:#A8D5BC;
  --warn:#C67B00;--warn-bg:#FFF8EC;
  --high:#B05000;--high-bg:#FFF2E8;
  --bad:#B01D1D;--bad-bg:#FFF2F2;
  --acc:#2C5F8A;--acc-bg:#EEF4FB;
  --pur:#6B3FA0;--pur-bg:#F3EEF9;
  --gold:#8A6A1A;--gold-lt:#FFF8EC;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#D5D0C8;color:var(--text);padding:16px;font-size:15px;line-height:1.55;}

/* Print controls */
.pc{max-width:990px;margin:0 auto 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.pc .info{flex:1;font-size:14px;color:#555;}
.btn-pr{background:var(--teal);color:white;border:none;padding:11px 26px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
.btn-pr:hover{background:var(--teal-dk);}
.btn-bk{background:white;color:var(--text);border:1.5px solid var(--border);padding:11px 18px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:15px;cursor:pointer;}

.report{max-width:990px;margin:0 auto;background:white;box-shadow:0 8px 48px rgba(0,0,0,.16);border-radius:4px;overflow:hidden;}

/* HEADER */
.hdr{background:linear-gradient(135deg,#0E6B5E,var(--teal) 60%,#22B5A4);padding:18px 30px 16px;color:white;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.hdr-brand{display:flex;align-items:center;gap:13px;}
.cn{font-size:19px;font-weight:700;letter-spacing:.4px;}
.cs{font-size:11px;opacity:.78;margin-top:2px;}
.hdr-meta{text-align:right;font-size:11px;opacity:.8;line-height:1.8;font-family:'IBM Plex Mono',monospace;}
.ps{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:10px;padding:12px 17px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px;overflow:hidden;}
.ps-l{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;opacity:.65;margin-bottom:2px;}
.ps-v{font-size:13px;font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* BODY */
.body{padding:18px 30px;background:var(--cream);}
.sec{margin-bottom:16px;}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--teal-lt);}
.si{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.si-t{background:var(--teal);color:white;} .si-b{background:var(--acc);color:white;}
.si-o{background:#C06000;color:white;} .si-g{background:var(--ok);color:white;}
.si-p{background:var(--pur);color:white;} .si-ek{background:#1A6B8A;color:white;}
.si-ec{background:#2A5A8A;color:white;} .si-f{background:#4A7A3A;color:white;}
.sh h2{font-size:16px;font-weight:700;color:var(--text);}
.sh p{font-size:12px;color:var(--text2);margin-top:1px;}
.sdiv{height:1px;background:linear-gradient(90deg,var(--teal-md),transparent);margin:20px 0;}

/* InBody gauge bars */
.ibsec{background:white;border:1px solid var(--bl);border-radius:10px;padding:14px 16px;margin-bottom:8px;}
.ibst{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bl);}
.ibg{margin-bottom:13px;}
.ibg:last-child{margin-bottom:0;}
.ibg-r{display:flex;align-items:baseline;gap:7px;margin-bottom:5px;}
.ibg-n{font-size:13px;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ibg-v{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.ibg-u{font-size:13px;color:var(--text2);}
.ibg-d{font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;font-family:'IBM Plex Mono',monospace;}
.d-pb{background:var(--bad-bg);color:var(--bad);} .d-ng{background:var(--ok-bg);color:var(--ok);}
.d-pg{background:var(--ok-bg);color:var(--ok);} .d-nb{background:var(--bad-bg);color:var(--bad);}
.d-0{background:var(--cream2);color:var(--text2);}
.ibg-tk{position:relative;height:11px;border-radius:6px;overflow:hidden;background:#ECEAE6;margin-bottom:4px;}
.ibg-un{position:absolute;top:0;left:0;height:100%;background:#ECEAE6;}
.ibg-nm{position:absolute;top:0;height:100%;background:#52C497;}
.ibg-dt{position:absolute;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.dok{background:var(--ok);} .dov{background:var(--bad);} .dun{background:var(--bad);}
.ibg-lb{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text3);flex-wrap:nowrap;gap:4px;}

/* Score gauge */
.sw{display:flex;align-items:center;gap:14px;background:white;border:1px solid var(--bl);border-radius:12px;padding:12px 16px;margin-bottom:10px;overflow:hidden;}
.snum{font-size:32px;font-weight:800;font-family:'IBM Plex Mono',monospace;line-height:1;}
.spts{font-size:14px;color:var(--text2);}
.sbadges{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.sbdg{font-size:12px;font-weight:600;padding:3px 11px;border-radius:10px;}

/* Ideal boxes */
.ideal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;min-width:0;}
.ib{background:linear-gradient(135deg,var(--teal-lt),#EBF4FF);border:1px solid var(--teal-md);border-radius:9px;padding:10px 12px;}
.ib-l{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.ib-t{font-size:13px;font-weight:700;color:var(--teal-dk);font-family:'IBM Plex Mono',monospace;}
.ib-a{font-size:11px;color:var(--text2);margin-top:2px;}
.ib-d{font-size:11px;font-weight:700;margin-top:4px;padding:1px 7px;border-radius:5px;display:inline-block;}

/* CID */
.cidb{background:linear-gradient(135deg,var(--cream),#EEF4FF);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.cid-l{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
.cid-t{font-size:14px;font-weight:700;color:var(--text);margin-bottom:7px;}
.cidbars{display:flex;flex-direction:column;gap:6px;margin-bottom:7px;}
.cid-br{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;}
.cid-bn{font-size:11px;color:var(--text2);}
.cid-bg{height:9px;background:#ECEAE6;border-radius:4px;overflow:hidden;}
.cid-bf{height:100%;border-radius:4px;}
.cid-desc{font-size:12px;color:var(--text2);line-height:1.5;font-style:italic;}

/* Body Balance */
.bbr{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--bl);border-radius:8px;padding:9px 13px;margin-bottom:8px;}
.bb-l{font-size:13px;color:var(--text2);flex:1;}
.bb-c{font-size:13px;font-weight:700;padding:3px 12px;border-radius:11px;}
.bbok{background:var(--ok-bg);color:var(--ok);} .bbwn{background:var(--warn-bg);color:var(--warn);}

/* LAB */
.lw{background:white;border:1px solid var(--bl);border-radius:10px;overflow:auto;margin-bottom:8px;}
.lst{background:var(--cream);padding:7px 14px;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bl);}
.lt{width:100%;border-collapse:collapse;min-width:440px;}
.lt th{padding:7px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);background:var(--cream);border-bottom:2px solid var(--border);}
.lt td{padding:9px 14px;border-bottom:1px solid var(--bl);font-size:14px;vertical-align:middle;}
.lt tr:last-child td{border-bottom:none;}
.ln{font-weight:700;font-size:14px;}
.lf{font-size:11px;color:var(--text2);margin-top:1px;}
.lv{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;white-space:nowrap;}
.lr{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;}
.chip{display:inline-block;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:700;white-space:nowrap;}
.ok{background:var(--ok-bg);color:var(--ok);} .wn{background:var(--warn-bg);color:var(--warn);}
.hi{background:var(--high-bg);color:var(--high);} .bd{background:var(--bad-bg);color:var(--bad);} .na{background:#F0EDE8;color:#bbb;}

/* LDL Goal */
.ldl-goal-card{background:linear-gradient(135deg,#FFF8EC,#FFF2E8);border:2px solid #E8C080;border-radius:12px;padding:16px 18px;margin-bottom:10px;}
.ldl-goal-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.ldl-goal-icon{font-size:24px;}
.ldl-goal-level{font-size:14px;font-weight:700;color:#7A4A00;}
.ldl-goal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.ldl-gi{background:white;border-radius:8px;padding:10px 12px;border:1px solid #E8D09A;}
.ldl-gi-l{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.ldl-gi-v{font-size:14px;font-weight:700;color:#8A4800;font-family:'IBM Plex Mono',monospace;}
.ldl-gi-s{font-size:11px;color:var(--text2);margin-top:2px;}
.ldl-basis{font-size:11px;color:var(--text2);margin-top:10px;font-style:italic;}

/* BP */
.bpc{background:white;border:1px solid var(--bl);border-radius:10px;padding:12px 17px;margin-bottom:10px;}
.bptop{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.bpns{display:flex;align-items:baseline;gap:3px;}
.bpn{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;}
.bpu{font-size:12px;color:var(--text2);}
.bptgts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.bpti{background:var(--cream);border-radius:8px;padding:9px 12px;}
.bptl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.bptv{font-size:13px;font-weight:700;color:var(--teal-dk);}
.bpts{font-size:11px;color:var(--text2);margin-top:1px;}

/* ── CV RISK — Redesigned ── */
.cv-card{background:white;border:1px solid var(--bl);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.cv-main{display:flex;flex-direction:column;}
.cv-gauge-side{background:white;padding:10px 16px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid var(--bl);}
.cv-pts-badge{background:var(--cream2);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:700;color:var(--text2);}
.cv-risk-side{padding:14px 20px;display:flex;flex-direction:column;justify-content:center;}
.cv-lvl-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.cv-lv-icon{font-size:28px;}
.cv-lv-name{font-size:22px;font-weight:800;line-height:1.1;}
.cv-lv-pct{font-size:14px;margin-top:4px;opacity:.85;font-weight:600;}
.cv-cut{font-size:10px;color:var(--text2);margin-top:6px;padding:5px 10px;background:var(--cream);border-radius:6px;line-height:1.5;}
.cv-LOW{color:var(--ok);} .cv-MOD{color:var(--warn);} .cv-HIGH{color:var(--high);} .cv-VHIGH{color:var(--bad);}
.cvbg-LOW{background:linear-gradient(135deg,#E8F8EF,#F5FBF8);} 
.cvbg-MOD{background:linear-gradient(135deg,#FFF8EC,#FFFBF6);}
.cvbg-HIGH{background:linear-gradient(135deg,#FFF2E8,#FFF8F4);}
.cvbg-VHIGH{background:linear-gradient(135deg,#FFF0F0,#FFF6F6);}
.cv-goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px 18px;border-top:1px solid var(--bl);}
.cv-goal{background:var(--cream);border-radius:8px;padding:9px 11px;}
.cv-gl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.cv-gv{font-size:13px;font-weight:700;color:var(--teal-dk);font-family:'IBM Plex Mono',monospace;}
.cv-gc{font-size:11px;color:var(--text2);margin-top:2px;}
.cv-factors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px;border-top:1px solid var(--bl);}
.cv-fac{text-align:center;padding:7px 5px;background:var(--cream);border-radius:7px;}
.cv-fl{font-size:9px;color:var(--text2);font-weight:600;margin-bottom:3px;}
.cv-fv{font-size:13px;font-weight:700;}
.cv-note{padding:8px 18px;background:var(--cream);border-top:1px solid var(--bl);font-size:11px;color:var(--text2);}

/* TC/HDL */
.rcard{display:inline-flex;align-items:center;gap:12px;background:white;border:1px solid var(--bl);border-radius:8px;padding:8px 15px;margin-top:7px;}
.rl{font-size:11px;font-weight:700;color:var(--text2);}
.rv{font-size:21px;font-weight:700;font-family:'IBM Plex Mono',monospace;}

/* EKG / Echo */
.ekg-card{background:white;border:1px solid var(--bl);border-radius:10px;overflow:hidden;margin-bottom:8px;}
.ekg-header{padding:10px 16px;display:flex;align-items:center;gap:10px;}
.ekg-h-teal{background:#1A6B8A;color:white;}
.ekg-h-echo{background:#3A5A8A;color:white;}
.ekg-header span{font-size:14px;font-weight:700;}
.ekg-body{padding:12px 16px;}
.ekg-result{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-bottom:10px;}
.er-norm{background:var(--ok-bg);color:var(--ok);}
.er-abn{background:var(--bad-bg);color:var(--bad);}
.er-na{background:var(--cream2);color:var(--text2);}
.ekg-comment{font-size:13px;color:var(--text);line-height:1.6;background:var(--cream);border-radius:7px;padding:9px 12px;}
.lvef-display{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.lvef-num{font-size:28px;font-weight:800;font-family:'IBM Plex Mono',monospace;}
.valve-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px;}
.vg-section{background:var(--cream);border-radius:8px;padding:10px 12px;}
.vg-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.valve-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bl);}
.valve-row:last-child{border-bottom:none;}
.vname{font-size:13px;font-weight:600;}
.vchips{display:flex;gap:4px;}
.vc{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}
.vc-mild{background:#FFF8EC;color:var(--warn);}
.vc-mod{background:var(--high-bg);color:var(--high);}
.vc-sev{background:var(--bad-bg);color:var(--bad);}

/* Charts */
.cc{background:white;border:1px solid var(--bl);border-radius:10px;padding:13px 14px 10px;margin-bottom:6px;}
.ctr{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.cdo{width:10px;height:10px;border-radius:50%;}
.ctt{font-size:13px;font-weight:700;}
.csb{font-size:11px;color:var(--text2);margin-top:1px;}
canvas{display:block;width:100%!important;}
.cleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.cli{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.cld{width:9px;height:9px;border-radius:50%;}

/* Data tables */
.dtw{background:white;border:1px solid var(--bl);border-radius:9px;overflow:auto;margin-bottom:10px;}
.dt{width:100%;border-collapse:collapse;min-width:480px;}
.dt th{background:var(--cream);padding:6px 10px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;}
.dt th.rh{text-align:left;}
.dt th.gc{background:var(--ok-bg);color:var(--ok);}
.dt td{padding:6px 10px;border-bottom:1px solid var(--bl);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.dt td.rh{text-align:left;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:600;color:var(--text2);background:#FDFBF8;}
.dt td.gtd{background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:11px;font-family:'Sarabun',sans-serif;}
.dt tr:last-child td{font-weight:700;background:var(--ok-bg);border-bottom:none;}
.tok{color:var(--ok);font-weight:600;}.twn{color:var(--warn);font-weight:600;}.tbd{color:var(--bad);font-weight:600;}.tna{color:#ccc;}

/* Vaccines */
.vg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.vi{background:white;border:1px solid var(--bl);border-radius:9px;padding:10px 12px;display:flex;align-items:flex-start;gap:8px;overflow:hidden;}
.vi-ico{font-size:20px;flex-shrink:0;margin-top:2px;}
.vi-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;}
.vi-age{font-size:11px;font-weight:700;color:var(--teal-dk);margin-top:1px;}
.vi-sub{font-size:11px;color:var(--text2);}
.vi-date{font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--teal-dk);margin-top:2px;}
.vs-done{background:var(--ok-bg);border-color:var(--ok-md);}
.vs-partial{background:var(--warn-bg);}
.vs-plan{background:var(--acc-bg);}

/* Follow-up */
.fu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.fu-item{background:white;border:1px solid var(--bl);border-radius:9px;padding:12px 14px;text-align:center;}
.fu-icon{font-size:22px;margin-bottom:5px;}
.fu-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.fu-val{font-size:16px;font-weight:700;color:var(--teal-dk);}
.fu-sub{font-size:11px;color:var(--text2);margin-top:2px;}

/* Advice */
.ac{border-radius:10px;overflow:hidden;margin-bottom:10px;}
.ah{padding:10px 16px;font-size:14px;font-weight:700;color:white;}
.ab{padding:12px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap;}
.a-diet .ah{background:var(--teal);} .a-diet .ab{background:var(--teal-lt);border:1px solid var(--teal-md);border-top:none;border-radius:0 0 10px 10px;}
.a-ex .ah{background:var(--acc);} .a-ex .ab{background:var(--acc-bg);border:1px solid #B8CCE0;border-top:none;border-radius:0 0 10px 10px;}
.a-sm .ah{background:var(--bad);} .a-sm .ab{background:var(--bad-bg);border:1px solid #DDB0B0;border-top:none;border-radius:0 0 10px 10px;}
.a-vax .ah{background:#2D7A5F;} .a-vax .ab{background:var(--ok-bg);border:1px solid var(--ok-md);border-top:none;border-radius:0 0 10px 10px;}
.nxt{display:flex;align-items:center;gap:13px;background:var(--gold-lt);border:1px solid #E8D09A;border-radius:10px;padding:12px 17px;margin-top:8px;}
.nd{font-size:17px;font-weight:700;color:var(--gold);font-family:'IBM Plex Mono',monospace;}
.nl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}

/* Footer */

/* ── LAB STATUS ── */
function labSt(t,v,g){
  var na='<span class="chip na">—</span>';
  if(!v)return{chip:na,color:'#aaa',ref:'—'};
  var n=+v,ok,warn,ref,cls,txt,col;
  if(t==='fbs'){ok=n<=99;warn=n<=125;ref='70–99 mg/dL';}
  else if(t==='a1c'){ok=n<5.7;warn=n<6.5;ref='< 5.7 %';}
  else if(t==='ldl'){ok=n<100;warn=n<130;ref='< 100 mg/dL (ตามความเสี่ยง)';}
  else if(t==='cr'){var mx=g==='หญิง'?1.1:1.2;ok=n<=mx;warn=n<=mx*1.3;ref=(g==='หญิง'?'0.5–1.1':'0.7–1.2')+' mg/dL';}
  else if(t==='ast'||t==='alt'){ok=n<=40;warn=n<=80;ref='< 40 U/L';}
  else if(t==='tc'){ok=n<200;warn=n<240;ref='< 200 mg/dL';}
  else if(t==='hdl'){var mn=g==='หญิง'?50:40;ok=n>=mn;warn=n>=(mn-10);ref=(g==='หญิง'?'> 50':'> 40')+' mg/dL';
    cls=ok?'ok':warn?'wn':'bd';txt=ok?'ปกติ':warn?'ต่ำเล็กน้อย':'ต่ำ';col=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
    return{chip:'<span class="chip '+cls+'">'+txt+'</span>',color:col,ref:ref};}
  else if(t==='tg'){ok=n<150;warn=n<200;ref='< 150 mg/dL';}
  else if(t==='upcr'){ok=n<150;warn=n<300;ref='< 150 mg/g';}
  else if(t==='tsh'){ok=n>=0.4&&n<=4.0;warn=(n>=0.1&&n<0.4)||(n>4&&n<=10);ref='0.4–4.0 mIU/L';
    cls=ok?'ok':warn?'wn':'bd';txt=ok?'ปกติ':n<0.4?'ต่ำ':'สูง';col=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
    return{chip:'<span class="chip '+cls+'">'+txt+'</span>',color:col,ref:ref};}
  else if(t==='albumin'){ok=n>=3.5&&n<=5.0;warn=n>=3.0&&n<3.5;ref='3.5–5.0 g/dL';
    cls=ok?'ok':warn?'wn':'bd';txt=ok?'ปกติ':n<3.5?'ต่ำ':'สูง';col=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
    return{chip:'<span class="chip '+cls+'">'+txt+'</span>',color:col,ref:ref};}
  else if(t==='psa'){if(n<4){cls='ok';txt='ปกติ';col='var(--ok)';}else if(n<=10){cls='wn';txt='เฝ้าระวัง';col='var(--warn)';}else{cls='bd';txt='สูง';col='var(--bad)';}
    return{chip:'<span class="chip '+cls+'">'+txt+'</span>',color:col,ref:'< 4.0 ng/mL'};}
  else return{chip:na,color:'#aaa',ref:'—'};
  cls=ok?'ok':warn?'wn':'bd';txt=ok?'ปกติ':warn?'สูงเล็กน้อย':'สูง';col=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
  return{chip:'<span class="chip '+cls+'">'+txt+'</span>',color:col,ref:ref};
}

/* ── LDL GOAL: Thai DLP / ESC 2021 / ACC 2025 ── */
function calcLdlGoal(r){
  var risk=r.ascvdRisk||'';
  var hasASCVD=r.hasASCVD==='yes';
  var hasFH=r.hasFH==='yes';
  var dm=r.hasDMRisk||'';
  var ckd=r.ckdStage||'';
  var custom=r.ldlGoalCustom||'';

  /* Very High Risk criteria */
  var isVeryHigh=risk==='very-high'||hasASCVD||(hasFH&&hasASCVD)||ckd==='ckd5'||dm==='dm-organ';
  /* High Risk criteria */
  var isHigh=risk==='high'||hasFH||dm==='dm-simple'||ckd==='ckd3'||ckd==='ckd4';
  /* Moderate */
  var isMod=risk==='moderate';

  var goal, pctReduce, basis, lvlTh;
  if(custom){
    goal=custom; basis='กำหนดโดยแพทย์'; pctReduce=''; lvlTh='กำหนดเอง';
  } else if(isVeryHigh){
    goal='< 55 mg/dL';pctReduce='≥ 50%';
    basis='Very High Risk: มีโรค ASCVD / DM+organ damage / CKD stage 5 / HeFH+ASCVD';
    lvlTh='ความเสี่ยงสูงมาก';
  } else if(isHigh){
    goal='< 70 mg/dL';pctReduce='≥ 50%';
    basis='High Risk: DM ไม่มี organ damage / HeFH / CKD stage 3–4 / SCORE2 ≥10%';
    lvlTh='ความเสี่ยงสูง';
  } else if(isMod){
    goal='< 100 mg/dL';pctReduce='≥ 30%';
    basis='Moderate Risk: SCORE2 5–9.9%';
    lvlTh='ความเสี่ยงปานกลาง';
  } else {
    goal='< 116 mg/dL';pctReduce='';
    basis='Low Risk: SCORE2 < 5%';
    lvlTh='ความเสี่ยงต่ำ';
  }
  var curr=+r.ldl||0;
  var achieved=curr>0 && goal ? curr < parseInt(goal.replace(/[<\s]/g,'')) : null;
  return{goal:goal,pctReduce:pctReduce,basis:basis,lvlTh:lvlTh,achieved:achieved,curr:curr};
}


/* ── GFR / CKD ── */
function calcGFR(cr, age, g){
  if(!cr||!age) return null;
  var cr_v=+cr, k=g==='หญิง'?0.7:0.9, a=g==='หญิง'?-0.241:-0.302;
  var s=g==='หญิง'?1.012:1;
  var rat=cr_v/k;
  var gfr=142*Math.pow(Math.min(rat,1),a)*Math.pow(Math.max(rat,1),-1.200)*Math.pow(0.9938,age)*s;
  return Math.round(gfr);
}
function ckdStageFromGFR(gfr){
  if(gfr===null) return null;
  if(gfr>=90) return {stage:'G1',label:'ปกติ หรือ ↑',color:'var(--ok)',chip:'ok'};
  if(gfr>=60) return {stage:'G2',label:'ลดลงเล็กน้อย',color:'var(--ok)',chip:'ok'};
  if(gfr>=45) return {stage:'G3a',label:'ลดลงเล็กน้อย-ปานกลาง',color:'var(--warn)',chip:'wn'};
  if(gfr>=30) return {stage:'G3b',label:'ลดลงปานกลาง-มาก',color:'var(--warn)',chip:'wn'};
  if(gfr>=15) return {stage:'G4',label:'ลดลงมาก',color:'var(--bad)',chip:'bd'};
  return {stage:'G5',label:'ไตวายเรื้อรัง',color:'var(--bad)',chip:'bd'};
}

/* ── INBODY GAUGE ── */
function ibGauge(name,val,unit,nMin,nMax,tMax,delta,deltaGoodUp){
  if(!val)return'';
  var v=+val,tm=tMax||nMax*1.8;
  var db='';
  if(delta!==null&&delta!==undefined&&!isNaN(+delta)){
    var d=+delta,sign=d>0?'+':'';
    var dc=d===0?'d-0':deltaGoodUp?(d>0?'d-pg':'d-nb'):(d>0?'d-pb':'d-ng');
    db='<span class="ibg-d '+dc+'">'+sign+d.toFixed(1)+'</span>';
  }
  function p(x){return Math.min(100,Math.max(0,x/tm*100));}
  var uw=p(nMin),nw=p(nMax)-p(nMin),dp=p(v);
  var dc2=v<nMin?'dun':v>nMax?'dov':'dok';
  var rangeStr=nMin+' – '+nMax+' '+unit;
  return '<div class="ibg">'+
    '<div class="ibg-r"><span class="ibg-n">'+name+'</span><span class="ibg-v">'+val+'</span><span class="ibg-u"> '+unit+'</span>'+db+'</div>'+
    '<div class="ibg-tk"><div class="ibg-un" style="width:'+uw+'%"></div><div class="ibg-nm" style="left:'+uw+'%;width:'+nw+'%"></div><div class="ibg-dt '+dc2+'" style="left:calc('+dp+'% - 6px)"></div></div>'+
    '<div class="ibg-lb"><span>ต่ำกว่าเกณฑ์</span><span style="color:var(--ok);font-weight:700">ปกติ: '+rangeStr+'</span><span>สูงกว่าเกณฑ์</span></div>'+
    '</div>';
}

/* ── InBody Score SVG ── */
function scoreSVG(score){
  /* 270° arc: start at 225° (bottom-left), sweep CW to 315° (bottom-right)
     Score 0-100 fills 0-270° of the arc.
     All text is INSIDE the circle, nothing overlaps the arc tip. */
  var sc=parseInt(score)||0;
  var hex=sc>=70?'#1A7A4A':sc>=50?'#C67B00':'#B01D1D';
  var bgFill=sc>=70?'#EDF7F2':sc>=50?'#FFF8EC':'#FFF2F2';
  var desc=sc>=70?'ดี':sc>=50?'พอใช้':'ควรปรับปรุง';

  var W=148,H=140,cx=74,cy=80,R=54,sw=11;
  /* start=225°, sweep=270° CW (SVG sweep-flag=1) */
  var startDeg=225,totalDeg=270;
  var filledDeg=totalDeg*(sc/100);

  function pol(deg){
    var r=deg*Math.PI/180;
    return{x:parseFloat((cx+R*Math.cos(r)).toFixed(3)),
           y:parseFloat((cy+R*Math.sin(r)).toFixed(3))};
  }

  var S=pol(startDeg),E=pol(startDeg+totalDeg),F=pol(startDeg+filledDeg);
  var tla=totalDeg>180?1:0;
  var fla=filledDeg>180?1:0;

  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  /* soft background circle */
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R-sw/2-2)+'" fill="'+bgFill+'" opacity="0.6"/>';
  /* grey track */
  s+='<path d="M '+S.x+','+S.y+' A '+R+','+R+' 0 '+tla+',1 '+E.x+','+E.y+'"'+
    ' fill="none" stroke="#E5E0D8" stroke-width="'+sw+'" stroke-linecap="round"/>';
  /* filled arc */
  if(sc>0){
    s+='<path d="M '+S.x+','+S.y+' A '+R+','+R+' 0 '+fla+',1 '+F.x+','+F.y+'"'+
      ' fill="none" stroke="'+hex+'" stroke-width="'+sw+'" stroke-linecap="round"/>';
    /* tip dot */
    s+='<circle cx="'+F.x+'" cy="'+F.y+'" r="6" fill="'+hex+'" stroke="white" stroke-width="2"/>';
  }
  /* Score number — centered, large */
  s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle"'+
    ' font-size="30" font-weight="800" font-family="IBM Plex Mono,monospace" fill="'+hex+'">'+sc+'</text>';
  /* "คะแนน" below number */
  s+='<text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle"'+
    ' font-size="10" font-family="Sarabun,sans-serif" fill="#9A9288">คะแนน</text>';
  /* Grade label: pill at top of circle, well inside arc */
  s+='<rect x="'+(cx-22)+'" y="'+(cy-R+sw+4)+'" width="44" height="16" rx="8" fill="'+hex+'" opacity="0.15"/>';
  s+='<text x="'+cx+'" y="'+(cy-R+sw+12)+'" text-anchor="middle" dominant-baseline="middle"'+
    ' font-size="10.5" font-weight="700" font-family="Sarabun,sans-serif" fill="'+hex+'">'+desc+'</text>';
  s+='</svg>';
  return s;
}

/* ── Body Type Grid SVG ── */
function bodyTypeSVG(active,bmiVal,pbfVal){
  var bmi=+bmiVal||0,pbf=+pbfVal||0;
  var W=390,H=270,pL=56,pR=10,pT=10,pB=36,plotW=W-pL-pR,plotH=H-pT-pB;
  var xMn=0,xMx=50,yMn=15,yMx=35,xS1=18,xS2=28,yS1=23,yS2=18.5;
  function xp(x){return pL+(x-xMn)/(xMx-xMn)*plotW;}
  function yp(y){return pT+plotH-(y-yMn)/(yMx-yMn)*plotH;}
  var zones=[
    {x1:xMn,x2:xS1,y1:yS1,y2:yMx,fill:'#E8EEF4',name:'Athletic'},
    {x1:xS1,x2:xS2,y1:yS1,y2:yMx,fill:'#F0EAF5',name:'Overweight'},
    {x1:xS2,x2:xMx,y1:yS1,y2:yMx,fill:'#FFE0E5',name:'Obesity'},
    {x1:xMn,x2:xS1,y1:yS2,y2:yS1,fill:'#E8F5EE',name:'Muscular'},
    {x1:xS1,x2:xS2,y1:yS2,y2:yS1,fill:'#F5F5F5',name:'Average'},
    {x1:xS2,x2:xMx,y1:yS2,y2:yS1,fill:'#FFF4E8',name:'Mild Obesity'},
    {x1:xMn,x2:xS1/2,y1:yMn,y2:yS2,fill:'#E8F0FA',name:'Slim Muscular'},
    {x1:xS1/2,x2:xS1,y1:yMn,y2:yS2,fill:'#F0F5FA',name:'Slim'},
    {x1:xS1,x2:xS2,y1:yMn,y2:yS2,fill:'#F8F5EA',name:'Slightly Thin'},
    {x1:xS2,x2:xMx,y1:yMn,y2:yS2,fill:'#FFF0F0',name:'Sarcopenic Obesity'}
  ];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;display:block" xmlns="http://www.w3.org/2000/svg">';
  svg+='<rect x="'+pL+'" y="'+pT+'" width="'+plotW+'" height="'+plotH+'" fill="#F8F6F2" rx="4"/>';
  zones.forEach(function(z){
    var x1=xp(z.x1),x2=xp(z.x2),y1=yp(z.y2),y2=yp(z.y1),isAct=z.name===active;
    svg+='<rect x="'+x1+'" y="'+y1+'" width="'+(x2-x1)+'" height="'+(y2-y1)+'" fill="'+(isAct?'#FFCDD5':z.fill)+'" stroke="white" stroke-width="1.5"/>';
  });
  zones.forEach(function(z){
    var cx=xp((z.x1+z.x2)/2),cy=yp((z.y1+z.y2)/2),isAct=z.name===active;
    svg+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle" font-size="9.5" font-family="Sarabun,sans-serif" font-weight="'+(isAct?700:500)+'" fill="'+(isAct?'#B01D1D':'#8B8070')+'">'+z.name+'</text>';
  });
  svg+='<line x1="'+xp(xS1)+'" y1="'+pT+'" x2="'+xp(xS1)+'" y2="'+(pT+plotH)+'" stroke="white" stroke-width="2"/>';
  svg+='<line x1="'+xp(xS2)+'" y1="'+pT+'" x2="'+xp(xS2)+'" y2="'+(pT+plotH)+'" stroke="white" stroke-width="2"/>';
  svg+='<line x1="'+pL+'" y1="'+yp(yS1)+'" x2="'+(pL+plotW)+'" y2="'+yp(yS1)+'" stroke="white" stroke-width="2"/>';
  svg+='<line x1="'+pL+'" y1="'+yp(yS2)+'" x2="'+(pL+plotW)+'" y2="'+yp(yS2)+'" stroke="white" stroke-width="2"/>';
  /* Y axis */
  [[yMx,'35'],[yS1,'23.0'],[yS2,'18.5'],[yMn,'15']].forEach(function(t){

    svg+='<circle cx="'+dx+'" cy="'+dy+'" r="3" fill="white"/>';
  }

}

/* ── CV Risk Speedometer (correct sweep) ── */
function cvArcSVG(risk,lv){
  /* viewBox=400x200. cy=topM+R so arc never clips.
     Legend rendered as HTML outside SVG to avoid clipping. */
  var sw=22,R=95,cx=200,topM=50,VW=400,VH=200;
  var cy=topM+R; /* 145 */
  var pct=Math.min(risk,50)/50;
  var nc=lv==='LOW'?'#1A7A4A':lv==='MOD'?'#B8860B':lv==='HIGH'?'#B05000':'#7B0000';
  var bg=lv==='LOW'?'#F2FBF6':lv==='MOD'?'#FFFBEF':lv==='HIGH'?'#FFF4EE':'#FFF2F2';

  function pt(f){
    var a=Math.PI*(1-f);
    return{x:parseFloat((cx+R*Math.cos(a)).toFixed(2)),
           y:parseFloat((cy-R*Math.sin(a)).toFixed(2))};
  }

  var s='<svg viewBox="0 0 '+VW+' '+VH+'" width="100%"'
       +' style="display:block;overflow:visible;"'
       +' xmlns="http://www.w3.org/2000/svg">';
  s+='<rect x="0" y="0" width="'+VW+'" height="'+VH+'" rx="14" fill="'+bg+'"/>';

  /* Grey track */
  var L=pt(0),Rp=pt(1);
  s+='<path d="M '+L.x+','+L.y+' A '+R+','+R+' 0 0,1 '+Rp.x+','+Rp.y+'"'
    +' fill="none" stroke="#DDD8CF" stroke-width="'+sw+'" stroke-linecap="round"/>';

  /* 5 colour zones — sweep=1, butt joins */
  var Z=[{f1:0.00,f2:0.20,c:'#27AE60'},{f1:0.20,f2:0.40,c:'#F39C12'},
         {f1:0.40,f2:0.60,c:'#E67E22'},{f1:0.60,f2:0.80,c:'#E74C3C'},
         {f1:0.80,f2:1.00,c:'#922B21'}];
  Z.forEach(function(z,i){
    var a=pt(z.f1),b=pt(z.f2);
    s+='<path d="M '+a.x+','+a.y+' A '+R+','+R+' 0 0,1 '+b.x+','+b.y+'"'
      +' fill="none" stroke="'+z.c+'" stroke-width="'+sw+'" stroke-linecap="butt"/>';
    if(i===0)s+='<circle cx="'+a.x+'" cy="'+a.y+'" r="'+(sw/2)+'" fill="'+z.c+'"/>';
    if(i===4)s+='<circle cx="'+b.x+'" cy="'+b.y+'" r="'+(sw/2)+'" fill="'+z.c+'"/>';
  });

  /* Scale ticks + labels outside arc, x clamped [18,382] */
  var rT=R+sw/2+2, rL=R+sw/2+18;
  [{f:0,t:'0%'},{f:0.2,t:'10%'},{f:0.4,t:'20%'},
   {f:0.6,t:'30%'},{f:0.8,t:'40%'},{f:1.0,t:'50%'}].forEach(function(tk){
    var ang=Math.PI*(1-tk.f);
    var x1=parseFloat((cx+rT*Math.cos(ang)).toFixed(1));
    var y1=parseFloat((cy-rT*Math.sin(ang)).toFixed(1));
    var x2=parseFloat((cx+(rT+7)*Math.cos(ang)).toFixed(1));
    var y2=parseFloat((cy-(rT+7)*Math.sin(ang)).toFixed(1));
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2
      +'" stroke="#ABA39B" stroke-width="1.5"/>';
    var lx=Math.max(18,Math.min(382,parseFloat((cx+rL*Math.cos(ang)).toFixed(1))));
    var ly=parseFloat((cy-rL*Math.sin(ang)).toFixed(1));
    s+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle"'
      +' font-size="11" font-family="IBM Plex Mono,monospace" fill="#9A9288">'+tk.t+'</text>';
  });

  /* Needle */
  var na=Math.PI*(1-pct),nLen=R-sw/2-4;
  var nx=parseFloat((cx+nLen*Math.cos(na)).toFixed(2));
  var ny=parseFloat((cy-nLen*Math.sin(na)).toFixed(2));
  var pa=na+Math.PI/2,hw=5.5;
  var b1x=parseFloat((cx+hw*Math.cos(pa)).toFixed(2)),b1y=parseFloat((cy-hw*Math.sin(pa)).toFixed(2));
  var b2x=parseFloat((cx-hw*Math.cos(pa)).toFixed(2)),b2y=parseFloat((cy+hw*Math.sin(pa)).toFixed(2));
  s+='<polygon points="'+nx+','+ny+' '+b1x+','+b1y+' '+b2x+','+b2y+'" fill="#2C2820"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="17" fill="#2C2820"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="#F0EDE8"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#2C2820"/>';

  /* % text below hub — VH=200, cy=145, text at 178,196 fits */
  s+='<text x="'+cx+'" y="'+(cy+33)+'" text-anchor="middle"'
    +' font-size="32" font-weight="800" font-family="IBM Plex Mono,monospace" fill="'+nc+'">'+risk.toFixed(1)+'%</text>';
  s+='<text x="'+cx+'" y="'+(cy+52)+'" text-anchor="middle"'
    +' font-size="12" font-family="Sarabun,sans-serif" fill="#7A7268">โอกาสเกิดโรคหัวใจและหลอดเลือดใน 10 ปี</text>';
  s+='</svg>';
  return s;
}

/* ── IDEAL CALC ── */
function calcIdeal(h,g){
  var hm=+h/100; if(!hm)return{wRange:'—',wMid:null,mRange:'—',mMid:null,fat:'—'};
  var wL=(18.5*hm*hm).toFixed(1),wH=(22.9*hm*hm).toFixed(1),wM=((18.5+22.9)/2*hm*hm).toFixed(1);
  var iBW=20.7*hm*hm,pL=g==='หญิง'?0.28:0.38,pH=g==='หญิง'?0.39:0.54;
  var mL=(iBW*pL).toFixed(1),mH=(iBW*pH).toFixed(1),mM=((+mL+ +mH)/2).toFixed(1);
  return{wRange:wL+'–'+wH,wMid:+wM,mRange:mL+'–'+mH,mMid:+mM,fat:g==='หญิง'?'18–28':'10–20'};
}
function diffChip(a,t){
  if(!a||!t)return'';
  var d=(+a- +t).toFixed(1);
  if(Math.abs(+d)<0.1)return'<span class="ib-d" style="background:var(--ok-bg);color:var(--ok)">ในเกณฑ์ ✓</span>';
  var s=+d>0?'+':'',bg=+d>0?'var(--bad-bg)':'var(--ok-bg)',c=+d>0?'var(--bad)':'var(--ok)';
  return'<span class="ib-d" style="background:'+bg+';color:'+c+'">'+s+d+' kg</span>';
}

/* ── THAI CV RISK ── */
function extractAge(s){
  if(!s)return null;
  var m=s.match(/(\d+)\s*ปี/);if(m)return+m[1];
  var m2=s.match(/\d{4}/);if(m2){var y=+m2[0];return new Date().getFullYear()-(y>2400?y-543:y);}
  return null;
}
function cvRisk(r){
  /* If established ASCVD → skip calculation, return Very High Risk directly */
  if(r.hasASCVD==='yes'){
    var age2=extractAge(r.dob)||50;
    return{pts:null,risk:null,lv:'VHIGH',lth:'Very High Risk — มีโรคหลอดเลือดหัวใจอยู่แล้ว',
      icon:'🔴',cls:'cv-VHIGH',bgcls:'cvbg-VHIGH',age:age2,dm:false,ht:false,smoker:false,
      dyslip:false,tc:0,hdl:0,usedTC:false,
      bpGoal:'< 130/80 mmHg',hbpmGoal:'< 125/75 mmHg',
      ldlGoal:'< 55',isASCVD:true};
  }
  var age=extractAge(r.dob),g=r.gender||'';
  var sbp=+r.sbp||0,tc=+r.tc||0,hdl=+r.hdl||0,ldl=+r.ldl||0,tg=+r.tg||0;
  var a1c=+r.a1c||0,fbs=+r.fbs||0,note=(r.note||'').toLowerCase();
  var dm=note.indexOf('dm')>=0||a1c>=6.5||fbs>=126;
  var ht=note.indexOf('ht')>=0||sbp>=140;
  var smoker=r.smoker==='yes';
  var dyslip=note.indexOf('dyslip')>=0||ldl>=160||tc>=240;
  if(!age||!g)return null;
  var tcE=tc>0?tc:(ldl>0?ldl+(hdl||40)+(tg>0?tg/5:30):0);
  var hdlE=hdl>0?hdl:(g==='หญิง'?55:45);
  var pts=0;
  if(g==='ชาย'){if(age<40)pts=0;else if(age<45)pts=3;else if(age<50)pts=6;else if(age<55)pts=8;else if(age<60)pts=10;else if(age<65)pts=12;else if(age<70)pts=14;else pts=15;}
  else{if(age<40)pts=-7;else if(age<45)pts=-4;else if(age<50)pts=-1;else if(age<55)pts=1;else if(age<60)pts=3;else if(age<65)pts=5;else if(age<70)pts=6;else pts=7;}
  if(tcE<160)pts+=0;else if(tcE<200)pts+=1;else if(tcE<240)pts+=2;else if(tcE<280)pts+=3;else pts+=4;
  if(hdlE>=60)pts-=1;else if(hdlE>=50)pts+=0;else if(hdlE>=45)pts+=1;else pts+=2;
  if(sbp<130)pts+=0;else if(sbp<140)pts+=1;else if(sbp<160)pts+=2;else if(sbp<180)pts+=4;else pts+=5;
  pts+=(dm?(g==='ชาย'?3:4):0)+(smoker?2:0);
  var MAP={'-3':0.5,'-2':0.5,'-1':0.6,'0':0.7,'1':0.9,'2':1.1,'3':1.4,'4':1.8,'5':2.2,'6':2.8,'7':3.5,'8':4.4,'9':5.4,'10':6.8,'11':8.4,'12':10.4,'13':12.7,'14':15.6,'15':18.9,'16':22.9,'17':27.5,'18':33.0,'19':38.0,'20':44.0};
  var cp=Math.max(-3,Math.min(20,pts)),risk=MAP[String(cp)]||(cp>20?49:0.5);
  var lv,lth,icon,cls,bgcls;
  var fu=dm&&ht&&dyslip;
  if(risk<10&&!fu){lv='LOW';lth='ความเสี่ยงต่ำ';icon='🟢';cls='cv-LOW';bgcls='cvbg-LOW';}
  else if(risk<20){lv='MOD';lth='ความเสี่ยงปานกลาง';icon='🟡';cls='cv-MOD';bgcls='cvbg-MOD';}
  else if(risk<30){lv='HIGH';lth='ความเสี่ยงสูง';icon='🟠';cls='cv-HIGH';bgcls='cvbg-HIGH';}
  else{lv='VHIGH';lth='ความเสี่ยงสูงมาก';icon='🔴';cls='cv-VHIGH';bgcls='cvbg-VHIGH';}
  if(fu&&lv==='LOW'){lv='MOD';lth='ความเสี่ยงปานกลาง';icon='🟡';cls='cv-MOD';bgcls='cvbg-MOD';}
  var bpGoal=age>80?'< 140/90 mmHg':(dm||lv==='HIGH'||lv==='VHIGH')?'< 130/80 mmHg':'< 140/90 mmHg';
  var hbpmGoal=age>80?'< 135/85 mmHg':(dm||lv==='HIGH'||lv==='VHIGH')?'< 125/75 mmHg':'< 135/85 mmHg';
  return{pts:pts,risk:risk,lv:lv,lth:lth,icon:icon,cls:cls,bgcls:bgcls,age:age,dm:dm,ht:ht,smoker:smoker,dyslip:dyslip,tc:tcE,hdl:hdlE,usedTC:tc>0,bpGoal:bpGoal,hbpmGoal:hbpmGoal};
}

/* ── COMPUTE DELTAS FROM HISTORY ── */
function computeDeltas(r,hist){
  if(!hist||hist.length<2)return{};
  var sorted=hist.slice().sort(function(a,b){return(a.visitDate||'').localeCompare(b.visitDate||'');});
  var prev=sorted[sorted.length-2]; if(!prev)return{};
  function d(k){var c=+r[k],p=+prev[k];return(isNaN(c)||isNaN(p))?null:(c-p);}
  return{weight:d('weight'),smm:d('smm'),bfm:d('bfm'),pbf:d('pbf'),vfl:d('vfl'),bmr:d('bmr'),bmi:d('bmi')};
}

/* ── DIET ADVICE with protein guidelines ── */
function buildDietAdvice(r){
  var bmi=+r.bmi||0, weight=+r.weight||60, height=+r.height||160;
  var hm=height/100, ibw=+(22*hm*hm).toFixed(1);
  var age=extractAge(r.dob)||50, g=r.gender||'';
  var note=(r.note||'').toLowerCase();
  var hasDM=note.indexOf('dm')>=0||+r.a1c>=6.5||+r.fbs>=126;
  var hasHT=note.indexOf('ht')>=0||+r.sbp>=140;
  var hasCKD=note.indexOf('ckd')>=0||+r.cr>1.3;
  var hasSarco=r.cid&&r.cid.indexOf('Sarcopenic')>=0;
  var isObese=bmi>=27.5, isElderly=age>=65;

  /* Protein guideline selection */
  var pMin,pMax,pWt,pBasis,pGuide;
  if(hasCKD&&+r.cr>1.5){
    pMin=0.6;pMax=0.8;pWt=weight;pGuide='KDIGO';
    pBasis='ผู้ป่วยโรคไต CKD non-dialysis — KDIGO guideline';
  } else if(hasSarco){
    pMin=1.5;pMax=2.0;pWt=ibw;pGuide='ESPEN';
    pBasis='Sarcopenic Obesity — ESPEN guideline';
  } else if(isElderly&&isObese){
    pMin=1.2;pMax=1.5;pWt=weight;pGuide='ESPEN';
    pBasis='ผู้สูงอายุ ≥65 ปี น้ำหนักเกิน — ESPEN Elderly/Obesity';
  } else if(isObese){
    pMin=1.2;pMax=1.5;pWt=ibw;pGuide='ESPEN';
    pBasis='ภาวะน้ำหนักเกิน BMI ≥27.5 — ESPEN Obesity guideline';
  } else if(isElderly){
    pMin=1.0;pMax=1.2;pWt=weight;pGuide='ESPEN';
    pBasis='ผู้สูงอายุ ≥65 ปี — ESPEN Elderly guideline';
  } else {
    pMin=0.8;pMax=1.0;pWt=weight;pGuide='WHO/DRI';
    pBasis='ผู้ใหญ่ทั่วไป — WHO/DRI guideline';
  }
  var pGrMin=Math.round(pMin*pWt), pGrMax=Math.round(pMax*pWt);
  var meals=Math.ceil(pGrMin/30);
  var bmr=+r.bmr||0, tdee=bmr?Math.round(bmr*1.3):Math.round(weight*25);
  var deficit=isObese?Math.round(tdee*0.15):0;

  var L=[];
  L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  L.push('🥩 โปรตีนที่ควรได้รับต่อวัน ('+pGuide+')');
  L.push('   ▸ '+pGrMin+'–'+pGrMax+' กรัม/วัน');
  L.push('     ('+pMin+'–'+pMax+' ก./กก./วัน × '+pWt+' กก.'+(pWt!==weight?' [IBW]':' [น้ำหนักจริง]')+')');
  L.push('   ▸ อ้างอิง: '+pBasis);
  L.push('   ▸ แบ่งกิน '+meals+' มื้อ มื้อละ ~'+(Math.round(pGrMin/meals))+'–35 กรัม');
  L.push('');
  L.push('   แหล่งโปรตีนแนะนำ (กรัมต่อ 100 กรัมอาหาร):');
  L.push('   • อกไก่ 31 ก. | ปลาทูน่า 29 ก. | ปลาแซลมอน 25 ก.');
  L.push('   • กุ้ง 20 ก. | ไข่ 13 ก. | เต้าหู้แข็ง 8 ก. | ถั่วเหลือง 17 ก.');
  L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  L.push('');
  L.push('🔥 พลังงานที่ต้องการ: ~'+tdee+' แคลอรี/วัน'+(deficit?' (เป้าลดน้ำหนัก: ~'+(tdee-deficit)+' แคลอรี/วัน)':''));
  L.push('');

/* ── Auto Generate Summary ── */
function buildAutoSummary(r,cv,ldlGoalData,hasLVDys){
  var lines=[];
  var g=r.gender||'';
  // InBody
  if(r.inbodyScore){
    var sc=+r.inbodyScore;
    lines.push('⚖️ InBody Score: '+sc+'/100 — '+(sc>=70?'ดี ร่างกายแข็งแรง':sc>=50?'พอใช้ ควรปรับพฤติกรรม':'ต่ำ ควรปรับปรุงเร่งด่วน'));
  }
  if(r.bmi){
    var bmi=+r.bmi;
    lines.push('📏 BMI: '+bmi+' กก./ม.² — '+(bmi<18.5?'น้ำหนักน้อยเกิน':bmi<23?'ปกติ':bmi<27.5?'น้ำหนักเกิน':'อ้วน'));
  }
  // Sugar
  if(r.fbs||r.a1c){
    var ok=(+r.fbs<=125||!r.fbs)&&(+r.a1c<7.0||!r.a1c);
    lines.push('🩸 น้ำตาล: '+(r.fbs?'FBS '+r.fbs+' มก./ดล. ':'')+(r.a1c?'HbA1c '+r.a1c+'% ':'')+' — '+(ok?'อยู่ในเกณฑ์ดี':'ยังสูงกว่าเป้าหมาย ควรปรับยาและอาหาร'));
  }
  // Lipid
  if(r.ldl){
    var goal=ldlGoalData?ldlGoalData.goal:'<130';
    var ach=ldlGoalData?ldlGoalData.achieved:null;
    lines.push('🫀 LDL: '+r.ldl+' มก./ดล. — เป้าหมาย '+goal+' ('+((ach===true)?'บรรลุ ✓':'ยังไม่บรรลุ ควรปรับยา/อาหาร')+')');
  }
  // BP
  if(r.sbp){
    var bpOk=+r.sbp<140&&+r.dbp<90;
    lines.push('💉 ความดัน: '+r.sbp+'/'+(r.dbp||'—')+' มมปรอท — '+(bpOk?'อยู่ในเกณฑ์':'ยังสูง ควรวัดซ้ำและปรับยา'));
  }
  // CV Risk
  if(cv&&!cv.isASCVD&&cv.risk!==null) lines.push('❤️ ความเสี่ยงโรคหัวใจ 10 ปี: '+cv.risk.toFixed(1)+'% ('+cv.lth+')');
  if(cv&&cv.isASCVD) lines.push('🚨 มีโรคหลอดเลือดหัวใจอยู่แล้ว (Established ASCVD) — Very High Risk');
  // Echo
  if(hasLVDys&&r.lvef) lines.push('🔊 LVEF '+r.lvef+'% — มี LV Dysfunction ต้องติดตาม Echo ซ้ำ');
  return lines.join('\n');
}

    '<div class="fu-val" style="color:'+(hasLVDys?'var(--warn)':'var(--text)')+'">'+echoFreqDisplay+'</div>'+
    (hasLVDys?'<div style="font-size:10px;color:var(--warn);margin-top:3px;font-weight:600">⚠️ LV Dysfunction — ติดตามใกล้ชิด</div>':'')+
    '</div>'+
    '</div>';
  if(r.nextVisit)O+='<div class="nxt"><div style="font-size:24px">📅</div><div><div class="nl">นัดติดตามผลครั้งถัดไป</div><div class="nd">'+thDate(r.nextVisit)+'</div></div></div>';
  O+='</div>';

  /* ── SUMMARY CARD (Item 6) ── */
  O+='<div class="sdiv"></div><div class="sec"><div class="sh"><div class="si" style="background:#2C5F8A;color:white">📋</div><div><h2>สรุปผลการตรวจสุขภาพ</h2><p>สรุปเข้าใจง่ายสำหรับผู้ป่วย</p></div></div>';
  O+='<div style="background:white;border:1px solid var(--bl);border-radius:12px;padding:16px 18px;margin-bottom:10px;">';
  /* Auto-build summary */
  var summaryLines=[];
  if(r.inbodyScore) summaryLines.push('⚖️ InBody Score: '+r.inbodyScore+'/100 — '+(+r.inbodyScore>=70?'ดี ร่างกายแข็งแรง':(+r.inbodyScore>=50?'พอใช้ ควรปรับพฤติกรรม':'ควรปรับปรุงเร่งด่วน')));
  if(r.fbs||r.a1c){
    var fbsOk=!r.fbs||(+r.fbs<=125); var a1cOk=!r.a1c||(+r.a1c<7.0);
    summaryLines.push('🩸 น้ำตาล: '+(fbsOk&&a1cOk?'อยู่ในเกณฑ์ดี':'ยังสูงกว่าเป้าหมาย — ควรควบคุมอาหารและยา'));
  }
  if(r.ldl) summaryLines.push('🫀 LDL: '+r.ldl+' มก./ดล. — เป้าหมาย: '+ldlGoalData.goal+' ('+(ldlGoalData.achieved===true?'บรรลุเป้าหมาย ✓':'ยังไม่บรรลุ — ควรปรับยา/อาหาร')+')');
  if(r.sbp) summaryLines.push('💉 ความดัน: '+r.sbp+'/'+(r.dbp||'—')+' มมปรอท — '+(+r.sbp<140&&+r.dbp<90?'อยู่ในเกณฑ์':'ยังสูง ควรวัดซ้ำและปรับยา'));
  if(cv&&!cv.isASCVD) summaryLines.push('❤️ ความเสี่ยงโรคหัวใจ 10 ปี: '+cv.risk.toFixed(1)+'% — '+cv.lth);
  if(cv&&cv.isASCVD) summaryLines.push('🚨 มีโรคหลอดเลือดหัวใจอยู่แล้ว (Established ASCVD) — Very High Risk');
  if(hasLVDys) summaryLines.push('🔊 LVEF '+r.lvef+'% — มี LV Dysfunction ต้องติดตาม Echo ทุก '+(+r.lvef<40?'3':'3–6')+' เดือน');
  /* Custom summary */
  var customSummary=r.customSummary||summaryLines.join('<br>');
  O+='<div class="ab" style="font-size:14px;line-height:1.8;">'+customSummary.replace(/\n/g,'<br>')+'</div>';
  O+='</div></div>';

  /* ── DOCTORS NOTE (Item 7) ── */
  O+='<div class="sec"><div class="sh"><div class="si" style="background:#4A3A8A;color:white">✍️</div><div><h2>Doctor\'s Note — บันทึกจากแพทย์</h2><p>ข้อความเฉพาะสำหรับผู้ป่วยรายนี้</p></div></div>';
  O+='<div style="background:white;border:2px solid #4A3A8A;border-radius:12px;padding:16px 18px;margin-bottom:10px;min-height:80px;">';
  if(r.doctorNote){
    O+='<div style="font-size:14px;line-height:1.8;color:var(--text)">'+r.doctorNote.replace(/\n/g,'<br>')+'</div>';
  } else {
    O+='<div style="color:var(--text3);font-size:13px;font-style:italic;">(ยังไม่มีบันทึกจากแพทย์)</div>';
  }
  O+='</div></div>';

  /* ── ADVICE ── */
  O+='<div class="sdiv"></div><div class="sec"><div class="sh"><div class="si si-g">💡</div><div><h2>คำแนะนำจากแพทย์</h2></div></div>';
  /* Diet advice header with protein grams extracted */
  var proteinLine='';
  var pm=dietAdv.match(/▸\s*([\d–]+)\s*กรัม\/วัน/);
  if(pm)proteinLine=' <span style="font-size:13px;font-weight:600;background:rgba(255,255,255,0.25);padding:2px 10px;border-radius:12px;margin-left:6px">🥩 โปรตีน '+pm[1]+' ก./วัน</span>';
  if(dietAdv)O+='<div class="ac a-diet"><div class="ah">🥗 คำแนะนำด้านโภชนาการ'+proteinLine+'</div><div class="ab">'+dietAdv+'</div></div>';
  O+='<div class="ac a-ex"><div class="ah">🏃 คำแนะนำด้านการออกกำลังกาย + แคลอรีโดยประมาณ</div><div class="ab">'+exAdv+'</div></div>';
  if(r.smoker==='yes')O+='<div class="ac a-sm"><div class="ah">🚭 คำแนะนำการเลิกบุหรี่ — สำคัญมาก</div><div class="ab">การสูบบุหรี่เพิ่มความเสี่ยงโรคหัวใจและหลอดเลือด 2–4 เท่า และมะเร็งปอด 15–30 เท่า\nการหยุดสูบบุหรี่ภายใน 1 ปี ลดความเสี่ยงโรคหัวใจได้ถึง 50%\nกรุณาปรึกษาแพทย์เพื่อรับคำแนะนำเพิ่มเติม</div></div>';
  if(r.vaxAdvice)O+='<div class="ac a-vax"><div class="ah">💉 คำแนะนำวัคซีน</div><div class="ab">'+r.vaxAdvice+'</div></div>';
  O+='</div>';

  O+='</div>'; /* end body */

  /* FOOTER */
  O+='<div class="foot">'+
    '<div><div class="fn">CardioPluz Clinic</div>'+
    '<div style="font-size:11px;color:var(--text2)">เอกสารทางการแพทย์สำหรับการติดตามรักษา · ข้อมูลส่วนบุคคล กรุณาเก็บเป็นความลับ · นำรายงานนี้มาทุกครั้งที่เข้ารับการตรวจ</div></div>'+
    '<div><div class="sl"></div><div class="sn">'+(r.doctor||'แพทย์ผู้ดูแล')+'</div>'+
    '<div class="ss">ผู้บันทึก: '+(r.recorder||'—')+' | '+thDate(r.visitDate)+'</div></div>'+
    '</div>';

  O+='</div>'; /* end report */
  document.getElementById('rpt').innerHTML=O;
  setTimeout(function(){drawCharts(hist);},150);
}

/* ── CHARTS ── */
function drawCharts(hist){
  if(!hist||!hist.length)return;
  var labels=hist.map(function(h){return thDateSh(h.visitDate);});
  function def(k){return hist.map(function(h){return parseFloat(h[k])||null;});}
  Chart.defaults.font.family="'Sarabun',sans-serif";
  Chart.defaults.font.size=11;
  var P={r:'#C0392B',rA:'rgba(192,57,43,.1)',b:'#2C5F8A',bA:'rgba(44,95,138,.1)',
    g:'#1A7A4A',gA:'rgba(26,122,74,.1)',o:'#C67B00',oA:'rgba(198,123,0,.1)',
    p:'#6B3FA0',pA:'rgba(107,63,160,.1)',t:'#1A9B8C',tA:'rgba(26,155,140,.1)',
    br:'#8B4513',brA:'rgba(139,69,19,.1)'};
  function ds(l,d,c,cA,ya){return{label:l,data:d,borderColor:c,backgroundColor:cA,borderWidth:2,pointRadius:4,pointHoverRadius:6,pointBackgroundColor:c,tension:.35,fill:false,yAxisID:ya||'yL'};}
  var le=document.getElementById('labChart');
  if(le){
    new Chart(le,{type:'line',data:{labels:labels,datasets:[
      ds('FBS (มก./ดล.)',def('fbs'),P.r,P.rA,'yL'),ds('LDL (มก./ดล.)',def('ldl'),P.b,P.bA,'yL'),
      ds('AST (ยูนิต/ลิตร)',def('ast'),P.g,P.gA,'yL'),ds('ALT (ยูนิต/ลิตร)',def('alt'),P.p,P.pA,'yL'),
      ds('HbA1c (%)',def('a1c'),P.o,P.oA,'yR')
    ]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{maxRotation:25}},
        yL:{type:'linear',position:'left',grid:{color:'rgba(0,0,0,.04)'},beginAtZero:false,title:{display:true,text:'มก./ดล. | ยูนิต/ลิตร',font:{size:9}}},
        yR:{type:'linear',position:'right',grid:{drawOnChartArea:false},min:4,max:12,title:{display:true,text:'HbA1c (%)',font:{size:9},color:P.o},ticks:{color:P.o}}
      }}});
    var ll=document.getElementById('labLeg');
    if(ll)ll.innerHTML=[{l:'FBS',c:P.r},{l:'LDL',c:P.b},{l:'AST',c:P.g},{l:'ALT',c:P.p},{l:'HbA1c (แกนขวา)',c:P.o}]
      .map(function(s){return'<div class="cli"><div class="cld" style="background:'+s.c+'"></div>'+s.l+'</div>';}).join('');
  }
  var ie=document.getElementById('ibChart');
  if(ie){
    new Chart(ie,{type:'line',data:{labels:labels,datasets:[
      ds('น้ำหนัก (กก.)',def('weight'),P.r,P.rA,'yL'),ds('SMM (กก.)',def('smm'),P.g,P.gA,'yL'),
      ds('% ไขมัน',def('pbf'),P.o,P.oA,'yR'),ds('InBody Score',def('inbodyScore'),P.b,P.bA,'yR'),
      ds('VFL',def('vfl'),P.br,P.brA,'yR')
    ]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'rgba(0,0,0,.04)'},ticks:{maxRotation:25}},
        yL:{type:'linear',position:'left',grid:{color:'rgba(0,0,0,.04)'},beginAtZero:false,title:{display:true,text:'กก.',font:{size:9}}},
        yR:{type:'linear',position:'right',grid:{drawOnChartArea:false},beginAtZero:false,title:{display:true,text:'% | คะแนน | ระดับ',font:{size:9}}}
      }}});
    var il=document.getElementById('ibLeg');
    if(il)il.innerHTML=[{l:'น้ำหนัก (กก.)',c:P.r},{l:'SMM (กก.)',c:P.g},{l:'% ไขมัน (แกนขวา)',c:P.o},{l:'InBody Score (แกนขวา)',c:P.b},{l:'VFL (แกนขวา)',c:P.br}]
      .map(function(s){return'<div class="cli"><div class="cld" style="background:'+s.c+'"></div>'+s.l+'</div>';}).join('');
  }
}

render();
</script>
