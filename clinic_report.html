<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardioPluz — รายงานผลสุขภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
/* ══════════════════════════════════════
   VARIABLES & RESET
══════════════════════════════════════ */
:root{
  --teal:#1A9B8C; --teal-dark:#147A6E; --teal-light:#E6F6F4; --teal-mid:#A8DDD8;
  --cream:#F7F4EE; --cream2:#EDE9E0; --cream3:#E2DDD3;
  --surface:#FFFFFF; --border:#D4CFC4; --border-light:#EAE6DE;
  --text:#2C2820; --text2:#6B6057;
  --ok:#1A7A4A; --ok-bg:#EDF7F2; --ok-mid:#A8D5BC;
  --warn:#C67B00; --warn-bg:#FFF8EC;
  --bad:#B01D1D; --bad-bg:#FFF2F2;
  --accent:#2C5F8A;
  --gold:#8A6A1A;
  --cv-low:#1A7A4A; --cv-mod:#C67B00; --cv-high:#B05000; --cv-vhigh:#8B1A1A;
  --purple:#6B3FA0; --purple-bg:#F3EEF9;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#DDD9D0;color:var(--text);padding:20px;min-height:100vh;}

/* ── SCREEN CONTROLS ── */
.print-controls{max-width:960px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.print-controls .info{flex:1;font-size:14px;color:#555;}
.btn-print{background:var(--teal);color:white;border:none;padding:11px 26px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
.btn-print:hover{background:var(--teal-dark);}
.btn-back{background:white;color:var(--text);border:1.5px solid var(--border);padding:11px 18px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;cursor:pointer;}

/* ══════════════════════════════════════
   REPORT WRAPPER  — A4 print target
══════════════════════════════════════ */
.report{
  max-width:960px;margin:0 auto;background:var(--surface);
  box-shadow:0 4px 40px rgba(0,0,0,0.15);
}

/* ── HEADER ── */
.report-header{
  background:linear-gradient(135deg,var(--teal-dark) 0%,var(--teal) 100%);
  padding:20px 32px 18px;color:white;position:relative;overflow:hidden;
}
.report-header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.06);}
.report-header::after{content:'';position:absolute;bottom:-20px;right:120px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.04);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.hdr-brand{display:flex;align-items:center;gap:14px;}
.hdr-brand svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));}
.clinic-name{font-size:20px;font-weight:700;letter-spacing:.5px;}
.clinic-sub{font-size:12px;opacity:.8;margin-top:2px;}
.hdr-meta{text-align:right;font-size:12px;opacity:.8;line-height:1.7;font-family:'IBM Plex Mono',monospace;}

.patient-strip{
  background:rgba(255,255,255,0.13);border:1px solid rgba(255,255,255,0.22);
  border-radius:8px;padding:13px 18px;
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px;
}
.ps-label{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.7;margin-bottom:2px;}
.ps-val{font-size:13px;font-weight:600;}
.ps-val.mono{font-family:'IBM Plex Mono',monospace;}

/* ── BODY ── */
.report-body{padding:20px 32px;background:var(--cream);}
.sec-divider{height:1px;background:var(--border-light);margin:18px 0;}
.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.sec-tag{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:white;padding:2px 8px;border-radius:4px;}
.sec-tag.inbody{background:var(--teal);}
.sec-tag.lab{background:var(--accent);}
.sec-tag.trend{background:#6B3FA0;}
.sec-tag.cvrisk{background:#7A4A00;}
.sec-tag.tumor{background:#6B3FA0;}
.sec-tag.vax{background:#3D7A5F;}
.sec-tag.advice{background:#3D7A5F;}
.sec-title h2{font-size:14px;font-weight:700;}

/* ── TUMOR MARKER TABLE ── */
.tm-table{width:100%;border-collapse:collapse;margin-top:2px;}
.tm-table th{background:var(--purple-bg);padding:7px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--purple);border-bottom:2px solid #D4C8E8;}
.tm-table td{padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle;}
.tm-table tr:last-child td{border-bottom:none;}
.tm-gender-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px;}
.tm-male{background:#E8F0FA;color:#2C5F8A;}
.tm-female{background:#F3EEF9;color:#6B3FA0;}

/* ── INBODY CARDS ── */
.inbody-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;}
.ic{border:1px solid var(--border-light);border-radius:8px;padding:10px 10px 8px;background:var(--surface);position:relative;}
.ic-lbl{font-size:9px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.ic-val{font-size:19px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--text);line-height:1;}
.ic-unit{font-size:10px;color:var(--text2);margin-top:2px;}
.ic-badge{position:absolute;top:7px;right:7px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-bad{background:var(--bad-bg);color:var(--bad);}

/* IDEAL COMPARE */
.ideal-compare{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.icmp{background:linear-gradient(135deg,var(--teal-light),#E8F4FF);border:1px solid var(--teal-mid);border-radius:8px;padding:10px 12px;}
.icmp-lbl{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.icmp-target{font-size:12px;font-weight:700;color:var(--teal-dark);font-family:'IBM Plex Mono',monospace;}
.icmp-actual{font-size:10px;color:var(--text2);margin-top:2px;}
.icmp-diff{font-size:10px;font-weight:700;margin-top:3px;padding:1px 6px;border-radius:5px;display:inline-block;}

/* GAUGE */
.gauge-row{display:grid;grid-template-columns:140px 1fr 52px;align-items:center;gap:8px;margin-bottom:7px;}
.gauge-name{font-size:11px;color:var(--text2);}
.gauge-bg{height:7px;background:var(--border-light);border-radius:4px;overflow:hidden;}
.gauge-fill{height:100%;border-radius:4px;}
.gauge-val{font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;text-align:right;}

/* SCORE */
.score-box{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:12px 16px;margin-bottom:14px;}
.score-circle{width:66px;height:66px;border-radius:50%;border:3px solid currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.sc-num{font-size:22px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1;}
.sc-lbl{font-size:9px;font-weight:600;margin-top:1px;}
.sc-ok{color:var(--ok);} .sc-warn{color:var(--warn);} .sc-bad{color:var(--bad);}
.score-detail .sd-title{font-size:13px;font-weight:700;margin-bottom:3px;}
.score-detail .sd-sub{font-size:11px;color:var(--text2);}

/* LAB TABLE */
.lab-table{width:100%;border-collapse:collapse;}
.lab-table th{background:var(--cream);padding:7px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:2px solid var(--border);}
.lab-table td{padding:9px 12px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle;}
.lab-name{font-weight:600;font-size:13px;}
.lab-full{font-size:10px;color:var(--text2);}
.lab-val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;}
.lab-ref{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;}
.chip{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10px;font-weight:700;}
.chip-ok{background:var(--ok-bg);color:var(--ok);}
.chip-warn{background:var(--warn-bg);color:var(--warn);}
.chip-bad{background:var(--bad-bg);color:var(--bad);}
.chip-na{background:#f0f0f0;color:#aaa;}

/* BP ROW */
.bp-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:10px 14px;margin-bottom:10px;}
.bp-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:var(--text);}
.bp-label{font-size:10px;color:var(--text2);font-weight:600;margin-top:2px;}

/* CV RISK */
.cv-main{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start;margin-bottom:12px;}
.cv-gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.cv-arc-label{font-size:11px;font-weight:700;color:var(--text2);}
.cv-risk-box{border-radius:8px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.cv-risk-icon{font-size:24px;flex-shrink:0;}
.cv-risk-level{font-size:16px;font-weight:800;}
.cv-risk-sub{font-size:11px;margin-top:2px;opacity:.85;}
.cv-risk-LOW{background:#E8F8EF;border:2px solid #A8D5BC;color:var(--cv-low);}
.cv-risk-MOD{background:#FFF8EC;border:2px solid #F0C870;color:var(--cv-mod);}
.cv-risk-HIGH{background:#FFF2E8;border:2px solid #E8A870;color:var(--cv-high);}
.cv-risk-VHIGH{background:#FFF0F0;border:2px solid #D09090;color:var(--cv-vhigh);}
.cv-details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cv-factor{background:var(--surface);border:1px solid var(--border-light);border-radius:7px;padding:8px 10px;}
.cv-factor-lbl{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:3px;}
.cv-factor-val{font-size:13px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
.cv-factor-sub{font-size:10px;color:var(--text2);margin-top:1px;}
.cv-factors-row{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px;}
.cv-note{font-size:10px;color:var(--text2);background:var(--surface);border:1px solid var(--border-light);border-radius:7px;padding:8px 12px;line-height:1.5;margin-top:8px;}

/* ── CHARTS — stacked: Lab top, InBody below ── */
.chart-section{margin-top:4px;}
.chart-card{background:var(--surface);border:1px solid var(--border-light);border-radius:10px;padding:14px 14px 10px;margin-bottom:6px;}
.chart-card-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.ct-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chart-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.cl-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.cl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
canvas{display:block;width:100%!important;}

/* DATA TABLES */
.data-table-wrap{background:white;border:1px solid var(--border-light);border-radius:8px;overflow:auto;margin-bottom:14px;}
.data-table{width:100%;border-collapse:collapse;min-width:480px;}
.data-table th{background:var(--cream);padding:6px 10px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap;}
.data-table th.row-head{text-align:left;}
.data-table td{padding:6px 10px;border-bottom:1px solid var(--border-light);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;}
.data-table td.row-head{text-align:left;font-family:'Sarabun',sans-serif;font-size:11px;font-weight:600;color:var(--text2);background:#FDFBF8;}
.data-table tr:last-child td{border-bottom:none;font-weight:700;background:#F0F8F4;}
.dt-ok{color:var(--ok);} .dt-warn{color:var(--warn);} .dt-bad{color:var(--bad);} .dt-na{color:#bbb;}

/* VACCINE TABLE */
.vax-table{width:100%;border-collapse:collapse;font-size:12px;}
.vax-table th{background:var(--cream);padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);}
.vax-table td{padding:7px 10px;border-bottom:1px solid var(--border-light);vertical-align:middle;}
.vax-table tr:last-child td{border-bottom:none;}
.vax-status{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;}
.vs-done{background:var(--ok-bg);color:var(--ok);}
.vs-partial{background:var(--warn-bg);color:var(--warn);}
.vs-plan{background:#EEF4FB;color:var(--accent);}
.vs-na{background:#f0f0f0;color:#888;}
.vs-none{background:#f8f4f0;color:#bbb;}

/* ADVICE */
.advice-box{border-left:3px solid var(--teal);padding:10px 14px;background:var(--teal-light);border-radius:0 7px 7px 0;margin-bottom:9px;}
.advice-box.exercise{border-left-color:var(--accent);background:#EEF4FB;}
.ab-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:4px;}
.ab-text{font-size:12px;line-height:1.5;}
.next-box{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#FFF8F0,#FFF4E8);border:1px solid #F0D8B0;border-radius:8px;padding:11px 16px;margin-top:7px;}
.nv-lbl{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.nv-date{font-size:15px;font-weight:700;color:var(--gold);font-family:'IBM Plex Mono',monospace;}

/* FOOTER */
.report-footer{border-top:2px solid var(--border-light);padding:13px 32px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2);background:var(--cream2);}
.sig-line{border-top:1px solid var(--border);width:150px;margin:20px 0 3px auto;}

/* ══════════════════════════════════════
   PRINT — A4
══════════════════════════════════════ */
@media print{
  body{background:white;padding:0;font-size:11px;}
  .print-controls{display:none!important;}
  .report{box-shadow:none;max-width:100%;}
  .report-body{padding:14px 24px;}
  .report-header{padding:14px 24px 12px;}
  .report-footer{padding:10px 24px;}
  @page{margin:6mm 8mm;size:A4 portrait;}
  /* Keep charts from page-breaking mid-render */
  .chart-card{page-break-inside:avoid;}
  .data-table-wrap{page-break-inside:avoid;}
  .cv-main{page-break-inside:avoid;}
}
</style>
</head>

function thDate(d){
  if(!d)return'-';const p=d.split('-');
  if(p.length===3){const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const y=parseInt(p[0])<2400?parseInt(p[0])+543:parseInt(p[0]);
    return`${parseInt(p[2])} ${M[parseInt(p[1])-1]} ${y}`;}return d;
}
function thDateShort(d){
  if(!d)return'-';const p=d.split('-');
  if(p.length===3){const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
    const y=parseInt(p[0])<2400?parseInt(p[0])+543:parseInt(p[0]);
    return`${parseInt(p[2])} ${M[parseInt(p[1])-1]} ${String(y).slice(-2)}`;}return d;
}

function labStatus(test,val,gender){
  if(!val)return{chip:'<span class="chip chip-na">—</span>',color:'var(--text2)',ref:'-'};
  const v=parseFloat(val);let ok,warn,ref,txt,cls,color;
  switch(test){
    case'fbs':  ok=v<=99;warn=v<=125;ref='70–99 mg/dL';break;
    case'a1c':  ok=v<5.7;warn=v<6.5; ref='< 5.7 %';break;
    case'ldl':  ok=v<130;warn=v<160; ref='< 130 mg/dL';break;
    case'cr':   {const mx=gender==='หญิง'?1.1:1.2;ok=v<=mx;warn=v<=mx*1.3;ref=gender==='หญิง'?'0.5–1.1':'0.7–1.2 mg/dL';break;}
    case'ast':  ok=v<=40;warn=v<=80; ref='< 40 U/L';break;
    case'alt':  ok=v<=40;warn=v<=80; ref='< 40 U/L';break;
    // New labs
    case'tc':   ok=v<200;warn=v<240; ref='< 200 mg/dL';break;
    case'hdl':  {const mn=gender==='หญิง'?50:40;ok=v>=mn;warn=v>=(mn-10);ref=gender==='หญิง'?'> 50 mg/dL':'> 40 mg/dL';
                 cls=ok?'chip-ok':warn?'chip-warn':'chip-bad';
                 txt=ok?'ปกติ':warn?'ต่ำเล็กน้อย':'ต่ำ';
                 color=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
                 return{chip:`<span class="chip ${cls}">${txt}</span>`,color,ref};}
    case'tg':   ok=v<150;warn=v<200; ref='< 150 mg/dL';break;
    case'upcr': ok=v<150;warn=v<300; ref='< 150 mg/g';break;
    case'tsh':  ok=v>=0.4&&v<=4.0;warn=(v>=0.1&&v<0.4)||(v>4.0&&v<=10);ref='0.4–4.0 mIU/L';
                cls=ok?'chip-ok':warn?'chip-warn':'chip-bad';
                txt=ok?'ปกติ':v<0.4?'ต่ำ':'สูง';
                color=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
                return{chip:`<span class="chip ${cls}">${txt}</span>`,color,ref};
    case'albumin': ok=v>=3.5&&v<=5.0;warn=v>=3.0&&v<3.5;ref='3.5–5.0 g/dL';
                cls=ok?'chip-ok':warn?'chip-warn':'chip-bad';
                txt=ok?'ปกติ':v<3.5?'ต่ำ':'สูง';
                color=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
                return{chip:`<span class="chip ${cls}">${txt}</span>`,color,ref};
    case'psa':  if(v<4.0){cls='chip-ok';txt='ปกติ';color='var(--ok)';}
                else if(v<=10){cls='chip-warn';txt='เฝ้าระวัง';color='var(--warn)';}
                else{cls='chip-bad';txt='สูง';color='var(--bad)';}
                return{chip:`<span class="chip ${cls}">${txt}</span>`,color,ref:'< 4.0 ng/mL'};
    default: return{chip:'<span class="chip chip-na">—</span>',color:'var(--text2)',ref:'-'};
  }
  cls=ok?'chip-ok':warn?'chip-warn':'chip-bad';
  txt=ok?'ปกติ':warn?'สูงเล็กน้อย':'สูง';
  color=ok?'var(--ok)':warn?'var(--warn)':'var(--bad)';
  return{chip:`<span class="chip ${cls}">${txt}</span>`,color,ref};
}

function ibadge(val,okMin,okMax){
  if(!val)return'';const v=parseFloat(val);
  const[cls,txt]=v>=okMin&&v<=okMax?['b-ok','ปกติ']:v<okMin?['b-bad','ต่ำ']:['b-warn','สูง'];
  return`<span class="ic-badge ${cls}">${txt}</span>`;
}
function gcolor(val,okMin,okMax){
  if(!val)return'#ccc';const v=parseFloat(val);
  return v>=okMin&&v<=okMax?'var(--ok)':v>okMax?'var(--warn)':'var(--bad)';
}
function gw(val,mn,mx){if(!val)return'0%';return Math.min(100,Math.max(0,((parseFloat(val)-mn)/(mx-mn))*100))+'%';}
function scoreClass(s){const v=parseInt(s)||0;return v>=70?'sc-ok':v>=50?'sc-warn':'sc-bad';}

function calcIdeal(height,gender){
  const h=parseFloat(height);if(!h)return{wRange:'-',wMid:null,mRange:'-',mMid:null,fatRange:'-'};
  const hm=h/100;
  const wL=(18.5*hm*hm).toFixed(1),wH=(22.9*hm*hm).toFixed(1),wM=((18.5+22.9)/2*hm*hm).toFixed(1);
  const idealBW=20.7*hm*hm;
  const[pL,pH]=gender==='หญิง'?[0.28,0.39]:[0.38,0.54];
  const mL=(idealBW*pL).toFixed(1),mH=(idealBW*pH).toFixed(1),mM=((parseFloat(mL)+parseFloat(mH))/2).toFixed(1);
  return{wRange:`${wL}–${wH} kg`,wMid:wM,mRange:`${mL}–${mH} kg`,mMid:mM,fatRange:gender==='หญิง'?'18–28 %':'10–20 %'};
}
function diffChip(actual,target){
  if(!actual||!target)return'';
  const diff=(parseFloat(actual)-parseFloat(target)).toFixed(1);
  if(Math.abs(diff)<0.1)return`<span class="icmp-diff" style="background:var(--ok-bg);color:var(--ok)">ในเกณฑ์ ✓</span>`;
  const sign=diff>0?'+':'';
  const[bg,col]=diff>0?['var(--bad-bg)','var(--bad)']:['var(--ok-bg)','var(--ok)'];
  return`<span class="icmp-diff" style="background:${bg};color:${col}">${sign}${diff} kg</span>`;
}

// ══ THAI CV RISK — Framingham-based RAMA-EGAT score using actual lab values ══
// Reference: Thai CV Risk Score (Cardiovascular Risk for Thais)
// Variables: age, gender, Total Cholesterol, HDL, SBP, DM, Smoker
// Points table from Thai Heart Association / RAMA-EGAT study
function extractAge(dobStr){
  if(!dobStr)return null;
  const m=dobStr.match(/(\d+)\s*ปี/);if(m)return parseInt(m[1]);
  const m2=dobStr.match(/\d{4}/);if(m2){const y=parseInt(m2[0]);const birth=y>2400?y-543:y;return new Date().getFullYear()-birth;}
  return null;
}

function calcThaiCVRisk(r){
  const age    = extractAge(r.dob);
  const gender = r.gender||'';
  const sbp    = parseFloat(r.sbp)||0;
  const tc     = parseFloat(r.tc)||0;    // Total Cholesterol — primary variable
  const hdl    = parseFloat(r.hdl)||0;   // HDL — protective factor
  const ldl    = parseFloat(r.ldl)||0;   // fallback if TC not available
  const a1c    = parseFloat(r.a1c)||0;
  const fbs    = parseFloat(r.fbs)||0;
  const note   = (r.note||'').toLowerCase();

  const dm     = (r.dm==='yes'||note.includes('dm')||a1c>=6.5||fbs>=126);
  const ht     = (r.ht==='yes'||note.includes('ht')||sbp>=140);
  const smoker = r.smoker==='yes';
  const dyslip = (r.dyslipidemia==='yes'||note.includes('dyslip')||ldl>=160||tc>=240);

  if(!age||!gender) return null;

  // Use TC if available, estimate from LDL if not (TC ≈ LDL + HDL + TG/5)
  const tg   = parseFloat(r.tg)||0;
  const tcEff = tc>0 ? tc : (ldl>0 ? ldl + (hdl||40) + (tg>0?tg/5:30) : 0);
  const hdlEff= hdl>0 ? hdl : (gender==='หญิง'?55:45);
  const tcHDLRatio = tcEff>0 && hdlEff>0 ? tcEff/hdlEff : null;

  let pts = 0;

  // ── AGE POINTS (RAMA-EGAT Thai CV Risk) ──
  if(gender==='ชาย'){
    if     (age< 40) pts+=0;
    else if(age< 45) pts+=3;
    else if(age< 50) pts+=6;
    else if(age< 55) pts+=8;
    else if(age< 60) pts+=10;
    else if(age< 65) pts+=12;
    else if(age< 70) pts+=14;
    else             pts+=15;
  } else {
    if     (age< 40) pts-=7;
    else if(age< 45) pts+=-4;
    else if(age< 50) pts+=-1;
    else if(age< 55) pts+=1;
    else if(age< 60) pts+=3;
    else if(age< 65) pts+=5;
    else if(age< 70) pts+=6;
    else             pts+=7;
  }

  // ── TOTAL CHOLESTEROL (mg/dL) ──
  if(tcEff>0){
    if     (tcEff<160)  pts+=0;
    else if(tcEff<200)  pts+=1;
    else if(tcEff<240)  pts+=2;
    else if(tcEff<280)  pts+=3;
    else                pts+=4;
  }

  // ── HDL (protective — subtract points) ──
  if(hdlEff>0){
    if     (hdlEff>=60) pts-=1;
    else if(hdlEff>=50) pts+=0;
    else if(hdlEff>=45) pts+=1;
    else if(hdlEff>=35) pts+=2;
    else                pts+=2;
  }

  // ── SBP ──
  if     (sbp<120)          pts+=0;
  else if(sbp<130)          pts+=0;
  else if(sbp>=130&&sbp<140)pts+=1;
  else if(sbp>=140&&sbp<160)pts+=2;
  else if(sbp>=160&&sbp<180)pts+=4;
  else if(sbp>=180)         pts+=5;

  // ── DIABETES ──
  if(dm) pts += (gender==='ชาย' ? 3 : 4);

  // ── SMOKER ──
  if(smoker) pts += (gender==='ชาย' ? 2 : 2);

  // ── POINTS → 10-year risk % (RAMA-EGAT lookup table) ──
  const ptRisk = {
    '-3':0.5,'-2':0.5,'-1':0.6,'0':0.7,'1':0.9,'2':1.1,'3':1.4,
    '4':1.8,'5':2.2,'6':2.8,'7':3.5,'8':4.4,'9':5.4,'10':6.8,
    '11':8.4,'12':10.4,'13':12.7,'14':15.6,'15':18.9,'16':22.9,
    '17':27.5,'18':33.0,'19':38.0,'20':44.0
  };
  const cp   = Math.max(-3, Math.min(20, pts));
  const risk = ptRisk[String(cp)] || (cp>20?49:0.5);

  // ── RISK CATEGORY ──
  // Thai CV Risk: <10% Low | 10–19% Moderate | 20–29% High | ≥30% Very High
  let level,levelTH,icon,cls;
  const forceUp = dm&&ht&&dyslip;
  if     (risk<10 && !forceUp){level='LOW';  levelTH='ความเสี่ยงต่ำ';      icon='🟢';cls='cv-risk-LOW';}
  else if(risk<20)             {level='MOD';  levelTH='ความเสี่ยงปานกลาง';  icon='🟡';cls='cv-risk-MOD';}
  else if(risk<30)             {level='HIGH'; levelTH='ความเสี่ยงสูง';       icon='🟠';cls='cv-risk-HIGH';}
  else                         {level='VHIGH';levelTH='ความเสี่ยงสูงมาก';   icon='🔴';cls='cv-risk-VHIGH';}
  if(forceUp&&level==='LOW'){level='MOD';levelTH='ความเสี่ยงปานกลาง';icon='🟡';cls='cv-risk-MOD';}

  const ldlGoal={LOW:'< 130 mg/dL',MOD:'< 130 mg/dL',HIGH:'< 100 mg/dL',VHIGH:'< 70 mg/dL'};
  const usedTC = tc>0;

  return{pts,risk,level,levelTH,icon,cls,age,dm,ht,smoker,dyslip,
    sbp,tc:tcEff,hdl:hdlEff,tcHDLRatio,usedTC,
    ldlGoal:ldlGoal[level]};
}

function renderCVArc(risk){
  const pct=Math.min(risk,50)/50;
  const color=risk<10?'#1A7A4A':risk<20?'#C67B00':risk<30?'#B05000':'#8B1A1A';
  const cx=85,cy=85,r=68;
  const sx=cx+r*Math.cos(Math.PI),sy=cy+r*Math.sin(Math.PI);
  const ex2=cx+r*Math.cos(2*Math.PI),ey2=cy+r*Math.sin(2*Math.PI);
  const ang=Math.PI+Math.PI*pct;
  const fx=cx+r*Math.cos(ang),fy=cy+r*Math.sin(ang);
  const lg=pct>0.5?1:0;
  return`<svg width="170" height="104" viewBox="0 0 170 104">
    <path d="M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex2} ${ey2}" fill="none" stroke="#E5E0D8" stroke-width="13" stroke-linecap="round"/>
    ${pct>0?`<path d="M ${sx} ${sy} A ${r} ${r} 0 ${lg} 1 ${fx} ${fy}" fill="none" stroke="${color}" stroke-width="13" stroke-linecap="round"/>`:''}
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="20" font-weight="800" font-family="IBM Plex Mono,monospace" fill="${color}">${risk.toFixed(1)}%</text>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="10" font-family="Sarabun,sans-serif" fill="#6B6057">โอกาสเกิดโรคหัวใจ</text>
    <text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="10" font-family="Sarabun,sans-serif" fill="#6B6057">ใน 10 ปี</text>
    <text x="18" y="${cy+28}" text-anchor="middle" font-size="9" fill="#bbb">0%</text>
    <text x="152" y="${cy+28}" text-anchor="middle" font-size="9" fill="#bbb">50%</text>
  </svg>`;
}

function buildLabTable(hist){
  if(!hist||!hist.length)return'';
  const rows=[
    {key:'fbs',label:'FBS (mg/dL)',ref:99,high:true},
    {key:'a1c',label:'HbA1c (%)',ref:5.7,high:true},
    {key:'ldl',label:'LDL (mg/dL)',ref:130,high:true},
    {key:'ast',label:'AST (U/L)',ref:40,high:true},
    {key:'alt',label:'ALT (U/L)',ref:40,high:true},
    {key:'cr',label:'Cr (mg/dL)',ref:1.2,high:true},
  ];
  const cols=hist.map(h=>thDateShort(h.visitDate));
  let html=`<table class="data-table"><thead><tr><th class="row-head">ค่าตรวจ</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
  for(const row of rows){
    html+=`<tr><td class="row-head">${row.label}</td>`;
    for(const h of hist){
      const v=h[row.key];if(!v){html+=`<td class="dt-na">—</td>`;continue;}

      html+=`<td class="${cls}">${v}</td>`;
    }
    html+='</tr>';
  }
  return html+'</tbody></table>';
}

      ]

  ];
  // Add PSA only for male
  if(!g||g==='ชาย'){
    sections.push({
      title:'สารบ่งชี้มะเร็ง (Tumor Marker)',
      rows:[{key:'psa',name:'PSA',full:'Prostate-Specific Antigen — ต่อมลูกหมาก<span class="tm-gender-badge tm-male" style="display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:#E8F0FA;color:#2C5F8A;margin-left:6px">ชาย</span>',unit:'ng/mL'}]
    });
  }

  // Check if any value exists
  const anyValue = sections.some(s=>s.rows.some(row=>r[row.key]));
  if(!anyValue&&!r.tmNote) return '';

  let html='';
  for(const sec of sections){
    const hasVal=sec.rows.some(row=>r[row.key]);
    if(!hasVal) continue;
    html+=`<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:6px 0 4px;border-top:1px dashed var(--border-light);margin-top:6px;">${sec.title}</div>`;
    html+=`<table class="lab-table">
      <thead><tr><th>การตรวจ</th><th>ค่าที่ได้</th><th>ค่าอ้างอิง</th><th>ผล</th></tr></thead><tbody>`;
    for(const row of sec.rows){
      if(!r[row.key]) continue;
      const s=labStatus(row.key,r[row.key],g);
      html+=`<tr>
        <td><div class="lab-name">${row.name}</div><div class="lab-full">${row.full}</div></td>
        <td><span class="lab-val" style="color:${s.color}">${r[row.key]||'—'}</span> <small>${row.unit}</small></td>
        <td><span class="lab-ref">${s.ref}</span></td>
        <td>${s.chip}</td>
      </tr>`;
    }
    html+='</tbody></table>';
  }

  // TC/HDL ratio card
  const tc=parseFloat(r.tc),hdl=parseFloat(r.hdl);
  if(tc>0&&hdl>0){
    const ratio=(tc/hdl).toFixed(1);
    const ratioOk=parseFloat(ratio)<5;
    const ratioWarn=parseFloat(ratio)<6;
    html+=`<div style="display:inline-flex;align-items:center;gap:10px;background:${ratioOk?'var(--ok-bg)':ratioWarn?'var(--warn-bg)':'var(--bad-bg)'};border:1px solid ${ratioOk?'var(--ok-mid)':'#F0C870'};border-radius:8px;padding:8px 14px;margin-top:8px;">

      <span style="font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:${ratioOk?'var(--ok)':ratioWarn?'var(--warn)':'var(--bad)'}">${ratio}</span>
      <span class="chip ${ratioOk?'chip-ok':ratioWarn?'chip-warn':'chip-bad'}">${ratioOk?'ดี':ratioWarn?'เฝ้าระวัง':'ความเสี่ยงสูง'}</span>
      <span style="font-size:10px;color:var(--text2)">เป้าหมาย &lt; 5.0</span>
    </div>`;
  }

  if(r.tmNote){
    html+=`<div style="font-size:11px;color:var(--text2);font-style:italic;margin-top:8px;padding:6px 10px;background:var(--bg);border-radius:6px;">📝 หมายเหตุ: ${r.tmNote}</div>`;
  }
  return html;
}

        <div style="font-weight:600">${r.doctor||'แพทย์ผู้ดูแล'}</div>
        <div style="font-size:10px">ผู้บันทึก: ${r.recorder||'-'}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:2px">${thDate(r.visitDate)}</div>
      </div>
    </div>
  </div>`;

  setTimeout(()=>drawCharts(hist),120);
}

// ══ CHARTS ══
function drawCharts(hist){
  if(!hist||!hist.length)return;
  const labels=hist.map(h=>thDateShort(h.visitDate));
  const def=key=>hist.map(h=>parseFloat(h[key])||null);
  Chart.defaults.font.family="'Sarabun',sans-serif";
  Chart.defaults.font.size=10;
  const P={
    red:'#C0392B',redA:'rgba(192,57,43,0.1)',
    blue:'#2C5F8A',blueA:'rgba(44,95,138,0.1)',
    teal:'#1A9B8C',tealA:'rgba(26,155,140,0.1)',
    green:'#1A7A4A',greenA:'rgba(26,122,74,0.1)',
    orange:'#C67B00',orangeA:'rgba(198,123,0,0.1)',
    purple:'#6B3FA0',purpleA:'rgba(107,63,160,0.1)',
    brown:'#8B4513',brownA:'rgba(139,69,19,0.1)',
  };
  function ds(label,data,color,colorA,yAxis='yLeft'){
    return{label,data,borderColor:color,backgroundColor:colorA,borderWidth:2,
      pointRadius:3.5,pointHoverRadius:5,pointBackgroundColor:color,
      tension:0.35,fill:false,yAxisID:yAxis};
  }
  // LAB: left=FBS,LDL,AST,ALT  right=HbA1c
  const labCtx=document.getElementById('labChart')?.getContext('2d');
  if(labCtx){
    new Chart(labCtx,{type:'line',data:{labels,datasets:[
      ds('FBS (mg/dL)',def('fbs'),P.red,P.redA,'yLeft'),
      ds('LDL (mg/dL)',def('ldl'),P.blue,P.blueA,'yLeft'),
      ds('AST (U/L)',def('ast'),P.green,P.greenA,'yLeft'),
      ds('ALT (U/L)',def('alt'),P.purple,P.purpleA,'yLeft'),
      ds('HbA1c (%)',def('a1c'),P.orange,P.orangeA,'yRight'),
    ]},options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{maxRotation:25}},
        yLeft:{type:'linear',position:'left',grid:{color:'rgba(0,0,0,0.04)'},beginAtZero:false,title:{display:true,text:'mg/dL | U/L',font:{size:9}}},
        yRight:{type:'linear',position:'right',grid:{drawOnChartArea:false},min:4,max:12,
          title:{display:true,text:'HbA1c (%)',font:{size:9},color:P.orange},ticks:{color:P.orange,font:{weight:'600'}}}
      }}});
    document.getElementById('labLegend').innerHTML=[
      {l:'FBS (mg/dL)',c:P.red},{l:'LDL (mg/dL)',c:P.blue},
      {l:'AST (U/L)',c:P.green},{l:'ALT (U/L)',c:P.purple},
      {l:'HbA1c % (แกนขวา)',c:P.orange}
    ].map(s=>`<div class="cl-item"><div class="cl-dot" style="background:${s.c}"></div>${s.l}</div>`).join('');
  }
  // INBODY: left=kg  right=%, score, level
  const ibCtx=document.getElementById('ibChart')?.getContext('2d');
  if(ibCtx){
    new Chart(ibCtx,{type:'line',data:{labels,datasets:[
      ds('น้ำหนัก (kg)',def('weight'),P.red,P.redA,'yLeft'),
      ds('Muscle Mass (kg)',def('muscle'),P.green,P.greenA,'yLeft'),
      ds('SMM (kg)',def('smm'),P.teal,P.tealA,'yLeft'),
      ds('BFM ไขมัน (kg)',def('bfm'),P.orange,P.orangeA,'yLeft'),
      ds('% ไขมัน',def('pbf'),P.purple,P.purpleA,'yRight'),
      ds('InBody Score',def('inbodyScore'),P.blue,P.blueA,'yRight'),
      ds('VFL',def('vfl'),P.brown,P.brownA,'yRight'),
    ]},options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{maxRotation:25}},
        yLeft:{type:'linear',position:'left',grid:{color:'rgba(0,0,0,0.04)'},beginAtZero:false,title:{display:true,text:'kg',font:{size:9}}},
        yRight:{type:'linear',position:'right',grid:{drawOnChartArea:false},beginAtZero:false,title:{display:true,text:'% | Score | Level',font:{size:9}}}
      }}});
    document.getElementById('ibLegend').innerHTML=[
      {l:'น้ำหนัก (kg)',c:P.red},{l:'Muscle Mass (kg)',c:P.green},
      {l:'SMM (kg)',c:P.teal},{l:'BFM ไขมัน (kg)',c:P.orange},
      {l:'% ไขมัน (แกนขวา)',c:P.purple},{l:'InBody Score (แกนขวา)',c:P.blue},{l:'VFL (แกนขวา)',c:P.brown}
    ].map(s=>`<div class="cl-item"><div class="cl-dot" style="background:${s.c}"></div>${s.l}</div>`).join('');
  }
}

render();
</script>
